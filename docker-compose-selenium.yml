version: '3.8'

services:
  scraping-worker:
    build: .
    container_name: neptuno-scraping-worker
    restart: unless-stopped
    env_file:
      - docker.env
    environment:
      - ENABLE_SELENIUM=true
      - SELENIUM_REMOTE_URL=http://selenium:4444/wd/hub
      - TZ=America/Guayaquil
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./logs:/app/logs
      - ./config_neptuno.env:/app/config_neptuno.env:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    shm_size: 2gb
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["python", "run_production_worker.py"]
    depends_on:
      selenium:
        condition: service_healthy
    networks:
      - neptuno-network

  selenium:
    image: selenium/standalone-chrome:4.15.0
    container_name: selenium
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "4444:4444"  # Selenium Grid
      - "7900:7900"  # VNC para visualizar navegador
    environment:
      - SE_VNC_NO_PASSWORD=1
      - SE_SCREEN_WIDTH=1920
      - SE_SCREEN_HEIGHT=1080
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_SESSION_TIMEOUT=300
      - TZ=America/Guayaquil
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - neptuno-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4444/status"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  neptuno-network:
    driver: bridge
